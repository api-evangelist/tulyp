aid: tulyp
name: Tulyp
description: Tulyp is a SaaS treasury platform from French company SmarTrade SAS that
  gives CFOs and treasurers of SMEs and mid-caps (10-200M euro revenue) real-time
  visibility into their foreign-exchange (FX) exposure. The platform aggregates financial
  data from connected ERPs, accounting software, and banks, calculates net currency
  exposure by type and timeframe, translates currency movements into impact on revenue,
  margins, and EBITDA, and alerts when exposure crosses risk-policy thresholds. Backed
  by Speedinvest. Tulyp publishes no public developer API; it does publish an llms.txt
  content index for AI systems.
